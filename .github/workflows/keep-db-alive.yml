name: Keep Aiven DB Alive

# Aiven 무료 MySQL은 생각보다 훨씬 빨리(하루 만에) 자동으로 정지돼서,
# 3일 간격으론 부족했다. 30분마다 가벼운 쿼리를 날려 활성 상태를 유지한다.
# (이 저장소는 public이라 GitHub Actions 분당 과금 걱정 없음)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Aiven MySQL
        run: |
          sudo apt-get update -y && sudo apt-get install -y mysql-client
          mysql --ssl-mode=REQUIRED \
            -h "${{ secrets.AIVEN_DB_HOST }}" \
            -P "${{ secrets.AIVEN_DB_PORT }}" \
            -u "${{ secrets.AIVEN_DB_USER }}" \
            -p"${{ secrets.AIVEN_DB_PASSWORD }}" \
            "${{ secrets.AIVEN_DB_NAME }}" \
            -e "SELECT 1;"
