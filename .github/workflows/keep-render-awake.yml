name: Keep Render Awake

# Render 무료 웹서비스는 15분간 요청이 없으면 슬립 상태로 전환되므로,
# 10분마다 가벼운 요청을 보내 슬립을 방지한다.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: curl -sS -o /dev/null -w "status=%{http_code}\n" https://growtive.onrender.com/
