<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>GROWTIVE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>


    <!-- favicon -->
    <link rel="icon" href="/assets/img/favicon.ico?v=3" type="image/x-icon">
    <link rel="shortcut icon" href="/assets/img/favicon.ico?v=3" type="image/x-icon">
    <link rel="icon" href="/assets/img/icon-192.png?v=3" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/assets/img/icon-192.png?v=3">

    <!-- 📱 PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <!--로그인-->
    <link rel="stylesheet" href="/assets/css/login.css">
    <!--money (대시보드 css)-->
    <link rel="stylesheet" href="/assets/css/money.css">

    <!-- axios 전역 로드: main.js보다 위에 있어야 함 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- ✅ SPA 부트스트랩 (ESM) -->
    <script type="module" src="/app/core/main.js"></script>
</head>
<body>
<header class="topbar">
    <!-- 🌈 급여/지출 게이지: 이번 달 월급 대비 번 돈(왼쪽, 초록) / 쓴 돈(오른쪽, 빨강) 비율 -->
    <div class="topbar-gauge" id="topbar-gauge"></div>
    <div class="topbar-gauge-expense" id="topbar-gauge-expense"></div>

    <button id="sidebar-toggle" class="sidebar-toggle-btn" type="button" aria-label="메뉴 열기" aria-expanded="false">
        ☰
    </button>
    <a href="#/calendar" class="brand">
        <img src="/assets/img/icon-192.png?v=3" alt="" class="brand-icon">
        GROWTIVE
    </a>

    <!-- ⏱️ 실시간 급여 카운터 (월급 등록 + 근무 스케줄 설정 시에만 표시) -->
    <div class="topbar-salary-ticker" id="topbar-salary-ticker"></div>
</header>


<!--좌측 사이드 바 메뉴-->
<div class="container">
    <aside class="sidebar" id="sidebar">
        <!-- 데스크톱 전용: 사이드바 접기/펼치기 -->
        <div class="sidebar-top">
            <button type="button" id="sidebar-collapse-btn" class="sidebar-collapse-btn" aria-label="사이드바 접기/펼치기">
                <svg class="sidebar-collapse-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="11 17 6 12 11 7"></polyline>
                    <polyline points="18 17 13 12 18 7"></polyline>
                </svg>
            </button>
        </div>

        <!--가계부(홈)-->
        <div class="menu-title"><span class="sidebar-label">가계부</span></div>
        <ul>
            <li><a href="#/calendar">📅 <span class="sidebar-label">캘린더</span></a></li>
        </ul>
        <!--재무 대시보드-->
        <div class="menu-title"><span class="sidebar-label">재무 대시보드</span></div>
        <ul>
            <li><a href="#/money/flow">📈 <span class="sidebar-label">돈 흐름</span></a></li>
        </ul>
        <!--친구-->
        <div class="menu-title"><span class="sidebar-label">소셜</span></div>
        <ul>
            <li><a href="#/friends">👫 <span class="sidebar-label">친구</span></a></li>
        </ul>
        <!--관리자 전용 (JS로 role=ADMIN일 때만 표시)-->
        <div class="menu-title" id="adminMenuTitle" style="display:none;"><span class="sidebar-label">관리자</span></div>
        <ul id="adminMenuList" style="display:none;">
            <li><a href="#/admin/members">👥 <span class="sidebar-label">회원관리</span></a></li>
        </ul>
        <!--서비스 소개-->
        <div class="menu-title"><span class="sidebar-label">안내</span></div>
        <ul>
            <li><a href="#/about">ℹ️ <span class="sidebar-label">서비스 소개</span></a></li>
        </ul>

        <!-- 계정 영역: 유저 정보 / 다크모드 / 로그아웃 (상단바 대신 사이드바 하단에 고정) -->
        <div class="sidebar-footer">
            <a href="#/mypage" class="sidebar-user-link" id="sidebarUserLink">
                👤 <span class="sidebar-label" id="sidebarUserName">내 계정</span>
            </a>
            <button type="button" id="theme-toggle" class="sidebar-logout-btn" aria-label="다크모드 전환">
                <span id="theme-toggle-icon">🌙</span> <span class="sidebar-label" id="themeToggleLabel">다크 모드</span>
            </button>
            <button type="button" id="sidebarLogoutBtn" class="sidebar-logout-btn">🚪 <span class="sidebar-label">로그아웃</span></button>
        </div>
    </aside>

    <!-- ✅ 라우터가 이곳에 렌더링 -->
    <main id="app" class="content"></main>
</div>
<!-- 🌙 다크모드 토글 스크립트 -->
<script src="/app/ui/theme-toggle.js"></script>
<!-- 📱 모바일 사이드바 토글 스크립트 -->
<script src="/app/ui/sidebar-toggle.js"></script>
<!-- 📱 PWA 설치 지원 (서비스워커 등록) -->
<script src="/app/ui/pwa.js"></script>

<script type="module" src="/app/ui/topbar-user.js"></script>
</body>
</html>
