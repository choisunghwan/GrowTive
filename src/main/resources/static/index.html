<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>GROWTIVE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>


    <!-- favicon -->
    <link rel="icon" href="/assets/img/favicon.ico?v=3" type="image/x-icon">
    <link rel="shortcut icon" href="/assets/img/favicon.ico?v=3" type="image/x-icon">
    <link rel="icon" href="/assets/img/icon-192.png?v=3" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/assets/img/icon-192.png?v=3">

    <!-- 📱 PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <!--로그인-->
    <link rel="stylesheet" href="/assets/css/login.css">
    <!--money (대시보드 css)-->
    <link rel="stylesheet" href="/assets/css/money.css">

    <!-- axios 전역 로드: main.js보다 위에 있어야 함 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- ✅ SPA 부트스트랩 (ESM) -->
    <script type="module" src="/app/core/main.js"></script>
</head>
<body>
<header class="topbar">
    <!-- 🌈 급여/지출 게이지: 이번 달 월급 대비 번 돈(왼쪽, 초록) / 쓴 돈(오른쪽, 빨강) 비율 -->
    <div class="topbar-gauge" id="topbar-gauge"></div>
    <div class="topbar-gauge-expense" id="topbar-gauge-expense"></div>

    <button id="sidebar-toggle" class="sidebar-toggle-btn" type="button" aria-label="메뉴 열기" aria-expanded="false">
        ☰
    </button>
    <a href="#/dashboard" class="brand">
        <img src="/assets/img/icon-192.png?v=3" alt="" class="brand-icon">
        GROWTIVE
    </a>

    <!-- ⏱️ 실시간 급여 카운터 (월급 등록 + 근무 스케줄 설정 시에만 표시) -->
    <div class="topbar-salary-ticker" id="topbar-salary-ticker"></div>

    <!-- ✅ 로그인 유저 영역 -->
    <div class="topbar-user" id="topbar-user"></div>
        <!-- JS로 채움 -->

    <!-- 🌙/☀️ 테마 토글 버튼 -->
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        🌙
    </button>
</header>


<!--좌측 사이드 바 메뉴-->
<div class="container">
    <aside class="sidebar" id="sidebar">
        <!--가계부(홈)-->
        <div class="menu-title">가계부</div>
        <ul>
            <li><a href="#/dashboard">📅 캘린더</a></li>
        </ul>
        <!--재무 대시보드-->
        <div class="menu-title">재무 대시보드</div>
        <ul>
            <li><a href="#/money/dashboard">📈 돈 흐름</a></li>
        </ul>
        <!--친구-->
        <div class="menu-title">소셜</div>
        <ul>
            <li><a href="#/friends">👫 친구</a></li>
        </ul>
        <!--마이페이지-->
        <div class="menu-title">계정</div>
        <ul>
            <li><a href="#/mypage">👤 마이페이지</a></li>
            <!-- 모바일 전용: 상단바가 좁아서 로그아웃은 사이드바에서 -->
            <li class="sidebar-logout-item"><a href="#" id="sidebarLogoutBtn">로그아웃</a></li>
        </ul>
        <!--관리자 전용 (JS로 role=ADMIN일 때만 표시)-->
        <div class="menu-title" id="adminMenuTitle" style="display:none;">관리자</div>
        <ul id="adminMenuList" style="display:none;">
            <li><a href="#/admin/members">👥 회원관리</a></li>
        </ul>
        <!--서비스 소개-->
        <div class="menu-title">안내</div>
        <ul>
            <li><a href="#/about">ℹ️ 서비스 소개</a></li>
        </ul>
    </aside>

    <!-- ✅ 라우터가 이곳에 렌더링 -->
    <main id="app" class="content"></main>
</div>
<!-- 🌙 다크모드 토글 스크립트 -->
<script src="/app/ui/theme-toggle.js"></script>
<!-- 📱 모바일 사이드바 토글 스크립트 -->
<script src="/app/ui/sidebar-toggle.js"></script>
<!-- 📱 PWA 설치 지원 (서비스워커 등록) -->
<script src="/app/ui/pwa.js"></script>

<script type="module" src="/app/ui/topbar-user.js"></script>
</body>
</html>
