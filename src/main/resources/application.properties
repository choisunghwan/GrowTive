spring.application.name=GROWTIVE

# ------------------------------------------
# 서버 포트 (배포 플랫폼이 PORT 환경변수를 주입하면 그걸 사용, 로컬은 8080)
# ------------------------------------------
server.port=${PORT:8080}

# ------------------------------------------
# 프로필 (dev / test / prod) - 로컬은 dev, 배포 환경은 SPRING_PROFILES_ACTIVE=prod로 지정
# ------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ------------------------------------------
# DB 접속 정보
# - 로컬 개발: application-dev.properties (gitignore, 실제 비밀번호 포함)에서 재정의됨
# - 운영 배포: 아래 환경변수로 주입 (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD)
# ------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# 로컬(MariaDB)은 기본값 그대로, 운영(Aiven MySQL)은 SPRING_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver로 오버라이드
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}
# DB 세션 타임존 고정: 운영(Aiven) DB가 UTC 기본값이라 NOW()/CURRENT_TIMESTAMP가
# 한국 시간과 9시간 어긋나는 것을 방지 (last_login_at, created_at 등)
spring.datasource.hikari.connection-init-sql=SET time_zone='+09:00'

# ------------------------------------------
# MyBatis
# ------------------------------------------
# Mapper XML
mybatis.mapper-locations=classpath:/mappers/**/*.xml
# VO/DTO
mybatis.type-aliases-package=com.growtive.user
# DB  camelCase
mybatis.configuration.map-underscore-to-camel-case=true
# SQL
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ------------------------------------------
# 로깅
# ------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.com.growtive=DEBUG

# ------------------------------------------
# 카카오 소셜 로그인
# - REST API 키는 로컬은 application-dev.properties, 운영은 KAKAO_CLIENT_ID 환경변수로 주입
# - Client Secret 미사용 (카카오 앱에서 발급 안 함 -> client-authentication-method=none)
# ------------------------------------------
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=none
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
